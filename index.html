
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPACE SHOOTER</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#050817;color:white;
 font-family:Arial;text-align:center;
 overflow:hidden;
}
h1{color:#42e8ff;margin:12px 0}
#info{font-size:18px;margin:8px}
canvas{
 background:linear-gradient(#080d29,#151044);
 border:2px solid #42e8ff;
 border-radius:12px;
 width:min(96vw,500px);
 height:auto;
 touch-action:none;
}
.controls{margin:12px}
button{
 background:#1266cc;color:white;border:0;
 padding:14px 25px;border-radius:12px;
 font-size:19px;margin:5px;
}
#message{font-size:20px;color:#ffe66d}
</style>
</head>
<body>
<h1>🚀 SPACE SHOOTER</h1>
<div id="info">
 ⭐ Очки: <span id="score">0</span>
 &nbsp; ❤️ Життя: <span id="lives">3</span>
</div>
<canvas id="game" width="400" height="600"></canvas>
<div class="controls">
<button id="left">⬅️</button>
<button id="shoot">🔥 ВОГОНЬ</button>
<button id="right">➡️</button>
</div>
<div id="message">Натисни СТАРТ!</div>
<button id="start">▶ СТАРТ</button>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const scoreText=document.getElementById("score");
const livesText=document.getElementById("lives");
const message=document.getElementById("message");

let player={x:180,y:520,w:40,h:45};
let bullets=[],enemies=[],stars=[];
let score=0,lives=3,running=false;
let left=false,right=false,shooting=false;
let lastShot=0,spawnTimer=0;

for(let i=0;i<70;i++){
 stars.push({x:Math.random()*400,y:Math.random()*600,
 speed:1+Math.random()*3});
}

function drawPlayer(){
 ctx.font="38px Arial";
 ctx.textAlign="center";
 ctx.fillText("🚀",player.x+20,player.y+35);
}

function drawStars(){
 ctx.fillStyle="white";
 stars.forEach(s=>{
  ctx.fillRect(s.x,s.y,2,2);
  s.y+=s.speed;
  if(s.y>600){s.y=0;s.x=Math.random()*400;}
 });
}

function shoot(){
 let now=Date.now();
 if(now-lastShot>250){
  bullets.push({x:player.x+18,y:player.y});
  lastShot=now;
 }
}

function spawnEnemy(){
 let x=Math.random()*350;
 enemies.push({x,y:-45,speed:2+Math.random()*2});
}

function draw(){
 ctx.clearRect(0,0,400,600);
 drawStars();

 if(left)player.x-=5;
 if(right)player.x+=5;
 player.x=Math.max(0,Math.min(360,player.x));

 if(shooting)shoot();

 drawPlayer();

 ctx.fillStyle="#42e8ff";
 bullets.forEach((b,i)=>{
  b.y-=8;
  ctx.fillRect(b.x,b.y,5,15);
  if(b.y<0)bullets.splice(i,1);
 });

 enemies.forEach((e,i)=>{
  e.y+=e.speed;
  ctx.font="32px Arial";
  ctx.fillText("👾",e.x,e.y+30);

  if(e.y>560){
   enemies.splice(i,1);
   lives--;
   livesText.textContent=lives;
  }

  bullets.forEach((b,j)=>{
   if(b.x>e.x-25&&b.x<e.x+25&&
      b.y>e.y-25&&b.y<e.y+30){
    enemies.splice(i,1);
    bullets.splice(j,1);
    score+=10;
    scoreText.textContent=score;
   }
  });
 });

 if(lives<=0){
  running=false;
  message.textContent="💥 ГРУ ЗАВЕРШЕНО! Очки: "+score;
  return;
 }

 spawnTimer++;
 if(spawnTimer>55){
  spawnEnemy();
  spawnTimer=0;
 }

 if(running)requestAnimationFrame(draw);
}

function startGame(){
 player.x=180;
 bullets=[];enemies=[];
 score=0;lives=3;
 scoreText.textContent=score;
 livesText.textContent=lives;
 message.textContent="Знищуй ворогів!";
 running=true;
 spawnTimer=0;
 draw();
}

document.getElementById("start").onclick=startGame;

function hold(id,callback){
 let el=document.getElementById(id);
 el.addEventListener("pointerdown",e=>{
  e.preventDefault();callback(true);
 });
 el.addEventListener("pointerup",()=>callback(false));
 el.addEventListener("pointerleave",()=>callback(false));
 el.addEventListener("pointercancel",()=>callback(false));
}

hold("left",v=>left=v);
hold("right",v=>right=v);
hold("shoot",v=>shooting=v);

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")left=true;
 if(e.key==="ArrowRight"||e.key==="d")right=true;
 if(e.code==="Space")shooting=true;
});
document.addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")left=false;
 if(e.key==="ArrowRight"||e.key==="d")right=false;
 if(e.code==="Space")shooting=false;
});
</script>
</body>
</html>
